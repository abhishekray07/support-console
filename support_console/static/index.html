<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Console</title>

  <!-- highlight.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>

  <!-- marked.js for markdown rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>

  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <h1>Support Console</h1>
    </div>
    <div class="header-right">
      <span id="ws-status" class="status-badge status-disconnected" role="status" aria-label="WebSocket status" title="WebSocket status">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-label">Disconnected</span>
      </span>
      <span id="kernel-status" class="status-badge status-unknown" role="status" aria-label="Kernel status" title="Kernel status">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-label">Kernel: Unknown</span>
      </span>
    </div>
  </header>

  <!-- Main content area -->
  <main id="main">

    <!-- Left Panel: Chat -->
    <section id="chat-panel" class="panel">
      <div class="panel-header">
        <span class="panel-title">Chat</span>
      </div>

      <div id="chat-messages" class="chat-messages" role="log" aria-label="Chat messages">
        <!-- Messages will be rendered here -->
        <div class="chat-welcome">
          <div class="chat-welcome-icon" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <p>Ask Claude about your Flask app, or describe a bug to debug.</p>
        </div>
      </div>

      <!-- Stop button (visible during streaming) -->
      <div id="chat-streaming" class="chat-streaming hidden">
        <button id="chat-stop" class="btn btn-stop" title="Stop generating (Escape)" aria-label="Stop generating response" aria-keyshortcuts="Escape">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          </svg>
          <span>Stop</span>
        </button>
      </div>
      <span id="chat-sr-status" class="sr-only" aria-live="polite"></span>

      <div id="chat-announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

      <!-- Attachment preview -->
      <div id="attachment-preview" class="attachment-preview hidden" role="list" aria-label="Attached files">
      </div>

      <!-- Screen reader live region for file announcements -->
      <div id="file-announce" class="sr-only" aria-live="polite"></div>

      <div id="chat-input-area" class="chat-input-area">
        <button id="attach-btn" class="btn-attach" title="Attach files" aria-label="Attach files" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </button>
        <input type="file" id="file-input" multiple aria-hidden="true" tabindex="-1" class="hidden"
          accept="image/png,image/jpeg,image/gif,image/webp,.txt,.log,.csv,.json,.xml,.yaml,.py,.js,.ts,.html,.css,.md,.sh,.sql,.toml,.ini,.cfg,.conf">
        <textarea id="chat-input" class="chat-input" placeholder="Type a message... (Enter to send, Shift+Enter for newline)" rows="1" aria-label="Chat message input"></textarea>
        <button id="chat-send" class="btn btn-primary" title="Send message" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>

      <!-- Drop zone overlay -->
      <div id="drop-overlay" class="drop-overlay hidden" aria-hidden="true">
        <div class="drop-overlay-content">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
          <span>Drop files here</span>
        </div>
      </div>
    </section>

    <!-- Resizable divider -->
    <div id="divider" class="divider" role="separator" aria-orientation="vertical" aria-label="Resize panels" tabindex="0" title="Drag to resize panels">
      <div class="divider-handle"></div>
    </div>

    <!-- Right Panel: Notebook -->
    <section id="notebook-panel" class="panel">
      <div class="panel-header">
        <span class="panel-title">Notebook</span>
        <button id="clear-notebook" class="btn btn-ghost btn-sm" title="Clear all cells">Clear All</button>
      </div>

      <div id="notebook-cells" class="notebook-cells" role="list" aria-label="Notebook cells">
        <!-- Cells will be rendered here -->
        <div class="notebook-empty">
          <div class="notebook-empty-icon" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
          </div>
          <p>Code from Claude appears here. You can also add cells to run queries directly.</p>
        </div>
      </div>

      <div class="notebook-footer">
        <button id="add-cell" class="btn btn-secondary">
          <span>+ New Cell</span>
        </button>
      </div>
    </section>

  </main>

  <!-- Reconnecting overlay -->
  <div id="reconnecting-overlay" class="reconnecting-overlay hidden" role="alert" aria-live="assertive">
    <div class="reconnecting-content">
      <div class="spinner" aria-hidden="true"></div>
      <span>Reconnecting to server...</span>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
