[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-console"
version = "0.1.0"
description = "AI-powered debug shell for Flask + SQLAlchemy apps"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "jupyter_client>=8.0",
    "ipykernel>=6.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.25.0",
]

[project.scripts]
support-console = "support_console.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
